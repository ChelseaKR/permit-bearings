<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630"
  viewBox="0 0 1200 630" role="img"
  aria-labelledby="title description">
  <title id="title">Permit Bearings</title>
  <desc id="description">Public prototype for California ADU, JADU, and SB 9 permitting</desc>
  <rect width="1200" height="630" fill="#fafafa"/>
  <rect width="1200" height="14" fill="#fec02f"/>
  <rect x="0" y="14" width="18" height="616" fill="#003688"/>

  <g font-family="Arial, sans-serif">
    <text x="76" y="88" fill="#003688" font-size="22" font-weight="700"
      letter-spacing="2.2">PUBLIC PROTOTYPE</text>
    <line x1="76" y1="112" x2="1124" y2="112" stroke="#bcbbc1"
      stroke-width="2"/>

    <text x="76" y="210" fill="#000000" font-size="76" font-weight="700"
      letter-spacing="-1.5">Permit Bearings</text>
    <text x="76" y="274" fill="#3b3a48" font-size="36" font-weight="400">
      California ADU, JADU, and SB 9 permitting prototype
    </text>

    <g transform="translate(76 350)">
      <rect width="7" height="82" fill="#003688"/>
      <text x="28" y="34" fill="#000000" font-size="27" font-weight="700">
        Candidate routes
      </text>
      <text x="28" y="70" fill="#4a4958" font-size="21">
        from structured project facts
      </text>
    </g>

    <g transform="translate(440 350)">
      <rect width="7" height="82" fill="#003688"/>
      <text x="28" y="34" fill="#000000" font-size="27" font-weight="700">
        Official sources
      </text>
      <text x="28" y="70" fill="#4a4958" font-size="21">
        visible with every result
      </text>
    </g>

    <g transform="translate(790 350)">
      <rect width="7" height="82" fill="#003688"/>
      <text x="28" y="34" fill="#000000" font-size="27" font-weight="700">
        Questions for staff
      </text>
      <text x="28" y="70" fill="#4a4958" font-size="21">
        when facts still need review
      </text>
    </g>

    <line x1="76" y1="506" x2="1124" y2="506" stroke="#bcbbc1"
      stroke-width="2"/>
    <text x="76" y="562" fill="#003688" font-size="23" font-weight="700">
      Decision support only
    </text>
    <text x="1124" y="562" fill="#4a4958" font-size="21"
      text-anchor="end">chelseakr.github.io/permit-bearings/</text>
  </g>
</svg>
