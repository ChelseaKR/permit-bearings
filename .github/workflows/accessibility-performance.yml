name: Accessibility and performance

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessibility-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-quality:
    name: Browser quality
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked browser test dependencies
        id: install
        run: npm ci
      - name: Audit browser test dependencies
        run: npm audit --audit-level=high
      - name: Install matched Chromium
        id: chromium
        run: npx playwright install --with-deps chromium
      # The two browser gates below are independent: each needs the locked
      # dependencies and Chromium installed above, never the other's verdict.
      # Each runs whenever that setup succeeded, so a red gate cannot hide
      # the one after it. Before this, the Lighthouse budgets were skipped on 5
      # consecutive runs (2026-09-09 to 09-10, main included) behind a failing
      # axe step, and the job reported only the axe failure.
      - name: Run axe WCAG checks
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: npm run test:a11y
      - name: Run Lighthouse budgets
        if: ${{ !cancelled() && steps.install.outcome == 'success' && steps.chromium.outcome == 'success' }}
        run: npm run test:perf
