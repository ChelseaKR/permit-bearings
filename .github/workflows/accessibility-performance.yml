name: Accessibility and performance

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "29 8 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: accessibility-performance-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  browser-quality:
    name: Browser quality
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: "24"
          cache: npm
      - name: Install locked browser test dependencies
        run: npm ci
      - name: Audit browser test dependencies
        run: npm audit --audit-level=high
      - name: Install matched Chromium
        run: npx playwright install --with-deps chromium
      - name: Run axe WCAG checks
        run: npm run test:a11y
      - name: Run Lighthouse budgets
        run: npm run test:perf
