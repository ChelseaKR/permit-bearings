name: Source currency watch
on:
  schedule:
    - cron: "0 15 * * 1"  # Mondays 15:00 UTC (~8am Pacific)
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Re-fetch watched sources and diff hashes
        id: watch
        run: |
          set +e
          set -o pipefail
          PYTHONPATH=src python -m permit_pathways.harness --fetch | tee report.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - name: Open an issue if a source changed
        if: steps.watch.outputs.exit_code != '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Source currency alert: a watched legal source changed ($(date -u +%F))" \
            --body "$(printf 'The weekly currency check found changed or unreachable watched sources. Dependent rules are stale until re-verified against the new text.\n\n```\n%s\n```' "$(cat report.txt)")"
      - name: Check HCD HAU letters dashboard for new letters
        id: letters
        run: |
          set +e
          set -o pipefail
          python scripts/pull_hau_letters.py --check | tee letters.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - name: Open an issue if the letters dataset drifted
        if: steps.letters.outputs.exit_code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "HCD HAU letters dataset drifted ($(date -u +%F))" \
            --body "$(printf 'HCD published new or changed accountability letters. Refresh with:\n\n    python3 scripts/pull_hau_letters.py\n    python3 scripts/build_hcd_letters.py <today>\n\n```\n%s\n```' "$(cat letters.txt)")"
