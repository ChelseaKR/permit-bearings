name: Source currency watch
on:
  schedule:
    - cron: "0 15 * * 1"  # Mondays 15:00 UTC (~8am Pacific)
  workflow_dispatch:

permissions:
  issues: write
  contents: read

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Re-fetch watched sources and diff hashes
        id: watch
        run: |
          set +e
          set -o pipefail
          checked_at="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          PYTHONPATH=src python -m permit_pathways.harness --fetch \
            --snapshot-out source-state-proposed.json \
            --snapshot-id "source-watch-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --checked-at "$checked_at" \
            --receipt-method github_actions_source_currency_watch \
            --run-url "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}" \
            --commit-sha "$GITHUB_SHA" | tee report.txt
          watch_exit="$?"
          has_changed_sources="$(
            python -c \
              'import json; from pathlib import Path; payload = json.loads(Path("source-state-proposed.json").read_text(encoding="utf-8")); changed = payload.get("changed_source_ids"); print("true" if isinstance(changed, list) and changed else "false")' \
              2>/dev/null || printf 'false'
          )"
          echo "exit_code=$watch_exit" >> "$GITHUB_OUTPUT"
          echo "has_changed_sources=$has_changed_sources" >> "$GITHUB_OUTPUT"
      - name: Build the exact re-verification review package
        if: steps.watch.outputs.has_changed_sources == 'true'
        run: |
          set +e
          PYTHONPATH=src python -m permit_pathways.review_queue_cli \
            --source-state source-state-proposed.json \
            --out source-review-worklist.json \
            --decisions-template-out source-review-decisions-template.json
          queue_exit="$?"
          set -e
          case "$queue_exit" in
            0|1)
              test -s source-review-worklist.json
              test -s source-review-decisions-template.json
              echo "review package generated (queue exit $queue_exit)"
              ;;
            *) exit "$queue_exit" ;;
          esac
      - name: Retain the exact re-verification review package
        if: steps.watch.outputs.has_changed_sources == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-review-package
          path: |
            source-state-proposed.json
            source-review-worklist.json
            source-review-decisions-template.json
          if-no-files-found: error
          retention-days: 30
      # Exit 1 means a source was fetched and its content hash moved, a rule
      # aged out, or a golden case regressed. Exit 2 means only that some
      # sources could not be downloaded — never escalated as a change.
      - name: Open an issue when currency review is needed
        if: ${{ always() && steps.watch.outputs.exit_code == '1' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "Source currency review needed ($(date -u +%F))" \
            --body "$(printf 'The weekly currency check found changed watched sources, stale rules, or a golden regression. Rules dependent on a changed source are stale until re-verified against the new text.\n\n```\n%s\n```' "$(cat report.txt)")"
      - name: Note sources that could not be re-fetched
        if: steps.watch.outputs.exit_code == '2'
        run: |
          echo "::warning title=Watched sources unverifiable::One or more watched sources could not be downloaded this run. Recorded hashes and last verification dates stand; no rule was marked stale. See the run summary."
      - name: Publish the currency report to the run summary
        if: always()
        run: |
          [ -f report.txt ] || exit 0
          {
            echo "### Source currency check"
            echo
            echo '```'
            cat report.txt
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the proposed source-state receipt for human review
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: source-state-proposed
          path: source-state-proposed.json
          if-no-files-found: warn
          retention-days: 30
      - name: Check HCD HAU letters dashboard for new letters
        id: letters
        run: |
          set +e
          set -o pipefail
          python scripts/pull_hau_letters.py --check | tee letters.txt
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"
      - name: Open an issue if the letters dataset drifted
        if: steps.letters.outputs.exit_code == '3'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "HCD HAU letters dataset drifted ($(date -u +%F))" \
            --body "$(printf 'HCD published new or changed accountability letters. Refresh with:\n\n    python3 scripts/pull_hau_letters.py\n    python3 scripts/build_hcd_letters.py <today>\n\n```\n%s\n```' "$(cat letters.txt)")"
