name: Standards

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standards-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: standards
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Fetch pinned private standards
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ChelseaKR/portfolio-standards
          # A released tag. Until 2026-10-05 this was a commit on the standards
          # default branch (553909b, the merge of portfolio-standards PR #97),
          # because every tag before v3.0.0 keyed this repository under its old
          # GitHub name and pinning one would have failed this check on an
          # unchanged repository (issue #74). v3.0.1 carries the current key.
          # .standards-version records the same tag, and the freshness step
          # refuses a drift between the two.
          ref: v3.0.1
          ssh-key: ${{ secrets.STANDARDS_DEPLOY_KEY }}
          path: .standards
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check the recorded pin and standards freshness
        run: |
          set -euo pipefail
          test "$(cat .standards-version)" = "v3.0.1"
          python3 .standards/automation/check_staleness.py --standards-dir .standards

      - name: Check standards version pins
        run: python3 .standards/automation/check_versions.py --standards-dir .standards

      - name: Check repository conformance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .standards/automation/conformance_check.py
          --repo .
          --strict
          --network
