name: Standards

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: standards-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  standards:
    name: standards
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          persist-credentials: false

      - name: Fetch pinned private standards
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v4
        with:
          repository: ChelseaKR/portfolio-standards
          ref: 225bfbb6fe011539616309395deb78259f2571fc
          ssh-key: ${{ secrets.STANDARDS_DEPLOY_KEY }}
          path: .standards
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Check standards freshness
        run: python3 .standards/automation/check_staleness.py --standards-dir .standards

      - name: Check standards version pins
        run: python3 .standards/automation/check_versions.py --standards-dir .standards

      - name: Check repository conformance
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          python3 .standards/automation/conformance_check.py
          --repo .
          --strict
          --network
